version: '3.8'

services:
  competitor-intel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: competitor-intel-bri
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount SQLite database directory to host machine for persistent storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
